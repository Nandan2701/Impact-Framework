<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="38%" stop-color="#FFD54F"/>
      <stop offset="78%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#90A4AE"/>
      <stop offset="40%" stop-color="#ECEFF1"/>
      <stop offset="70%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF9800" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#softGlow)">
    <!-- Symmetrical, balanced, full bulb silhouette -->
    <path d="M 50 4
             C 71 4 86 19 86 38
             C 86 50 78 60 67 65.5
             L 67 73
             C 67 74.5 64.5 76 62 76
             L 38 76
             C 35.5 76 33 74.5 33 73
             L 33 65.5
             C 22 60 14 50 14 38
             C 14 19 29 4 50 4 Z"
          fill="url(#sunGlow)"
          stroke="#E65100"
          stroke-width="2"/>
    <!-- Glowing Filament -->
    <path d="M 40 68 L 43 47 L 47 51 L 50 44 L 53 51 L 57 47 L 60 68"
          fill="none" stroke="#D84315" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glossy specular highlight -->
    <path d="M 30 18 C 36 10 44 7 52 7 C 46 11 40 16 38 24 Z" fill="#FFFFFF" opacity="0.85"/>
    <!-- Metallic Screw Threads -->
    <rect x="31" y="76" width="38" height="6" rx="3" fill="url(#metal)" stroke="#455A64" stroke-width="1"/>
    <rect x="34" y="83" width="32" height="6" rx="3" fill="url(#metal)" stroke="#455A64" stroke-width="1"/>
    <rect x="37" y="90" width="26" height="5" rx="2.5" fill="url(#metal)" stroke="#455A64" stroke-width="1"/>
    <!-- Bottom Contact Point -->
    <path d="M 41 95 Q 50 100 59 95 Z" fill="#263238"/>
  </g>
</svg>
